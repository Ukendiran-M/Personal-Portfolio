# Static site, no real build: the build copies the site into dist/, because the Netlify project
# (set up for the old React version) deploys dist/ whatever netlify.toml says.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -R index.html favicon.svg robots.txt sitemap.xml assets dist/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Images keep their names when they change, so cache them for a week, not forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
