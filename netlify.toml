# Static site: no build step, publish the repository root.
# The command must not be empty: an empty one falls back to the old React site's "npm run build" set in the Netlify UI.
[build]
  publish = "."
  command = "echo 'Static site: nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Images keep their names when they change, so cache them for a week, not forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
